# ==================================================================================================
#  EINZIGE QUELLE für alles, was Ulf anbietet und was Agenten über ihn erfahren dürfen.
#
#  Gelesen von:
#    layouts/index.html                     Angebotskarten, Saison/Treffpunkt-Zeile, Adresse, JSON-LD
#    layouts/partials/anfrage-formular.html Angebots-Auswahl im Formular
#    layouts/partials/katalog.html          Katalog für die WebMCP-Werkzeuge (assets/js/anfrage.js),
#                                           /webmcp.json und /llms.txt
#  Seite und Werkzeuge lesen dieselben Zeilen — eine Preisänderung hier ändert beides.
#
#  REGELN
#  - Nur, was auf ersteschischule.at steht oder Ulf bestätigt hat. Nichts erfinden, nichts schätzen.
#  - Leeres Feld ("" oder []) = noch offen, mit "TODO Ulf:" im Kommentar daneben. Leere Felder
#    erscheinen NIRGENDS (nicht auf der Seite, nicht in Werkzeugen, nicht in webmcp.json/llms.txt);
#    Agenten bekommen stattdessen „bitte direkt bei Ulf erfragen“ (siehe offen_bei_ulf).
#  - Jede Aussage über Ulf ist ein WÖRTLICHES ZITAT der Seite (Startseite, Datenschutz, Impressum) —
#    keine Umschreibung, keine Ergänzung. tests/webmcp-probe.py prüft jedes Zitat am gebauten HTML und
#    jedes Wort jeder Aussage im fertigen Katalog: was nicht auf der Seite steht, ist ROT.
#  - Mehrsprachige Felder: {de, en, nl}. Werkzeug-Antworten sind deutsch; die Seite zeigt ihre Sprache.
#  - Werkzeug-Texte (Beschreibungen) stehen in data/webmcp.yaml.
# ==================================================================================================

anbieter:
  name: "Ulf Seidl"
  rolle: "Skilehrer"                       # Seitentitel „Ulf Seidl — Skilehrer in Flachau“
  titel: "Ulf Seidl — Skilehrer in Flachau"
  beschreibung: "Privater Skiunterricht in Flachau (Snow Space Salzburg). Persönlich, flexibel, auf Ihrem Niveau — beim erfahrenen Skilehrer Ulf Seidl."
  website: "https://ersteschischule.at/"
  kontakt_hinweis: "Am schnellsten erreichen Sie mich telefonisch oder per WhatsApp — auch kurzfristig während der Saison."
  sprachen_seite: ["de", "en", "nl"]
  unterrichtssprachen: ["de", "en"]   # Beleg: „Deutsch und Englisch“ (Startseite, Warum-Liste)
  adresse:
    strasse: "Stahlhammergasse 268"
    plz: "5542"
    ort: "Flachau"
    land: "Österreich"
    land_code: "AT"
  # Telefon, WhatsApp und E-Mail stehen in hugo.toml [params] (phone, whatsapp, email) — dort auch für
  # Kopfzeile, Impressum-Layout und Formular. Der Katalog liest sie von dort.

waehrung: "EUR"
personen_max: 4

# Angebotskarten (Reihenfolge = Reihenfolge auf der Seite). `wert` ist der Formularwert und muss
# wörtlich in THEMEN_LISTE der contact-api-Instanz stehen (projekt-entwicklung-contact-api/deploy/ulf/).
# `aufpreis_eur` = Aufpreis je weiterer Person für dieses Angebot (bis personen_max).
# Preise laut Ulf (Nachricht vom 04.11.2026); vorher Schnupperstunde 75, Halbtag 195, Ganztag 320, je Person + 15.
angebote:
  - id: "zwei_stunden"
    wert: "2 Stunden"
    preis_eur: 198
    aufpreis_eur: 25
    dauer_minuten: 120
    name: { de: "2 Stunden", en: "2 hours", nl: "2 uur" }
    dauer: { de: "von 9 bis 11 Uhr", en: "from 9 to 11 am", nl: "van 9 tot 11 uur" }
    text:
      de: "Ideal zum Kennenlernen oder für gezieltes Technik-Feintuning."
      en: "Perfect to get started or for focused technique fine-tuning."
      nl: "Ideaal om kennis te maken of om gericht aan uw techniek te werken."
  - id: "drei_stunden"
    wert: "3 Stunden"
    preis_eur: 279
    aufpreis_eur: 30
    dauer_minuten: 180
    featured: true
    name: { de: "3 Stunden", en: "3 hours", nl: "3 uur" }
    dauer: { de: "von 9 bis 12 Uhr", en: "from 9 am to 12 noon", nl: "van 9 tot 12 uur" }
    text:
      de: "Der Klassiker: genug Zeit für echte Fortschritte."
      en: "The classic: enough time for real progress."
      nl: "De klassieker: genoeg tijd voor echte vooruitgang."
  - id: "vier_stunden"
    wert: "4 Stunden"
    preis_eur: 356
    aufpreis_eur: 35
    dauer_minuten: 240
    name: { de: "4 Stunden", en: "4 hours", nl: "4 uur" }
    dauer: { de: "von 9 bis 14 Uhr mit einer Stunde Pause", en: "from 9 am to 2 pm with a one-hour break", nl: "van 9 tot 14 uur met een uur pauze" }
    text:
      de: "Technik, Geheimtipps und die schönsten Abfahrten der Region."
      en: "Technique, local secrets and the region's finest runs."
      nl: "Techniek, lokale tips en de mooiste afdalingen van de regio."

# Mehrere Personen: Satz unter den Karten (stand bis 04.11.2026 auf der Karte „Weitere Person“).
mehrere_personen:
  de: "Familie oder Freunde auf ähnlichem Niveau? Gerne bis 4 Personen."
  en: "Family or friends at a similar level? Up to 4 people welcome."
  nl: "Familie of vrienden van vergelijkbaar niveau? Tot 4 personen welkom."

# Frühbucherrabatt (Ulf, 04.11.2026). Der deutsche Satz steht wörtlich auf der Seite und als Regel im Katalog.
fruehbucher:
  prozent: 5
  tage_vorher: 45
  text:
    de: "Frühbucherrabatt: minus 5 % bei Buchung bzw. Reservierung bis 45 Tage im Voraus."
    en: "Early booking discount: 5 % off when you book or reserve at least 45 days in advance."
    nl: "Vroegboekkorting: 5 % korting bij boeking of reservering uiterlijk 45 dagen van tevoren."

saison:
  von_monat: 12
  bis_monat: 4
  text: { de: "Saison Dezember bis April", en: "Season December to April", nl: "Seizoen december tot april" }
  kurzfristig: "Ein Anruf genügt — auch während der Saison oft noch Termine frei."
  genaue_daten: ""        # TODO Ulf: erster und letzter Unterrichtstag der Saison 2026/27 (z. B. „6.12.2026–6.4.2027“)

treffpunkt:
  text:
    de: "Treffpunkt nach Vereinbarung, direkt an der Piste in Flachau"
    en: "meeting point by arrangement, right on the slopes of Flachau"
    nl: "ontmoetingspunt in overleg, direct aan de piste in Flachau"
  gebiet: ["Flachau", "Snow Space Salzburg"]
  gebiet_beleg: "mitten im Snow Space Salzburg"
  anfahrt: ""             # TODO Ulf: Anfahrt nach Flachau / zum üblichen Treffpunkt (Auto, Skibus, Bahn bis Altenmarkt?)
  parken: ""              # TODO Ulf: Parkmöglichkeit am üblichen Treffpunkt
  uebliche_treffpunkte: [] # TODO Ulf: übliche Treffpunkte, z. B. { name: "Talstation …", hinweis: "…" }

# Baustein 3: Fachkunde und Nachweise. Nur, was im Text über Ulf steht. Nachweis-Felder (Aussteller,
# Jahr, Prüf-URL) füllt Ulf; ohne sie bleibt der Eintrag eine Selbstauskunft und wird so bezeichnet.
qualifikationen:
  - id: "staatlich_gepruefter_skilehrer"
    bezeichnung: "staatlich geprüfter Skilehrer"
    aussteller: ""        # TODO Ulf: ausstellende Stelle (z. B. Landesskilehrerverband / Bundessportakademie?)
    jahr: ""              # TODO Ulf: Jahr der Prüfung
    nachweis_url: ""      # TODO Ulf: öffentliche Prüf-URL, falls es eine gibt (sonst leer lassen)
  - id: "erfahrung_flachau"
    bezeichnung: "seit über drei Jahrzehnten auf den Pisten von Flachau zuhause"
  - id: "skischulleitung"
    bezeichnung: "Viele Jahre habe ich eine der großen Skischulen des Ortes aufgebaut und geführt"
  - id: "unterrichtssprachen"
    bezeichnung: "Deutsch und Englisch"
  - id: "zielgruppen"
    bezeichnung: "Kinder, Erwachsene, Wiedereinsteiger — jedes Alter, jedes Niveau"
  - id: "koennensstufen"
    bezeichnung: "Vom ersten Pflugbogen bis zum Carving auf der schwarzen Piste"
# TODO Ulf: Mitgliedschaften (Skilehrerverband, WKO …) — erst auf die Seite schreiben, dann hier als Zitat mit nachweis_url.

# Ablauf und Bedingungen.
bedingungen:
  ablauf:                 # wörtliche Sätze der Startseite (Formular, Karten, Warum-Liste)
    - "Sagen Sie mir kurz, wann Sie kommen und was Sie sich wünschen — ich melde mich persönlich mit einem Terminvorschlag."
    - "Ich antworte persönlich. Mit E-Mail-Adresse erhalten Sie eine Bestätigung."
    - "Treffpunkt nach Vereinbarung, direkt an der Piste in Flachau"
    - "Ohne Sammelplatz, ohne Gruppennummer."
    - "Familie oder Freunde auf ähnlichem Niveau? Gerne bis 4 Personen."
  # Die folgenden Felder füllt Ulf. Sobald eines gefüllt ist, muss der Satz AUCH auf der Seite stehen —
  # die Probe verlangt für jede Aussage im Katalog ein Zitat der Seite.
  storno: ""              # TODO Ulf: Stornoregel (bis wann kostenlos, was danach?)
  schlechtwetter: ""      # TODO Ulf: was gilt bei Sturm, Liftstillstand, Nebel?
  zahlung: ""             # TODO Ulf: Zahlungsart (bar, Karte, Überweisung?) und Zeitpunkt (vorher, am Tag?)
  liftkarte: ""           # TODO Ulf: Ist die Liftkarte im Preis enthalten? (vermutlich nein — bitte bestätigen)
  leihausruestung: ""     # TODO Ulf: Leihausrüstung — eigene Empfehlung/Verleih in Flachau?
  kinder_mindestalter: "" # TODO Ulf: ab welchem Alter unterrichtest du Kinder?

# Baustein 4: Häufige Fragen. Die Antwort IST die Liste der Zitate (`antwort`, wörtlich von der Seite,
# zusammengesetzt mit Leerzeichen). `aus_angeboten: true` = Antwort aus den Angebotsdaten oben gebaut.
faqs:
  - frage: "Was kostet eine Privatstunde bei Ulf Seidl?"
    aus_angeboten: true
  - frage: "Wann ist Saison?"
    antwort: ["Saison Dezember bis April"]
  - frage: "Wo treffen wir uns?"
    antwort: ["Treffpunkt nach Vereinbarung, direkt an der Piste in Flachau"]
  - frage: "Für wen ist der Unterricht geeignet?"
    antwort: ["Kinder, Erwachsene, Wiedereinsteiger — jedes Alter, jedes Niveau", "Vom ersten Pflugbogen bis zum Carving auf der schwarzen Piste"]
  - frage: "Können mehrere Personen gemeinsam Unterricht nehmen?"
    antwort: ["Familie oder Freunde auf ähnlichem Niveau? Gerne bis 4 Personen."]
    aus_aufpreisen: true      # hängt je Angebot „<Name>: jede weitere Person + € n.“ an (aus den Angebotsdaten oben)
  - frage: "In welcher Sprache wird unterrichtet?"
    antwort: ["Deutsch und Englisch"]
  - frage: "Kann ich kurzfristig buchen?"
    antwort: ["Ein Anruf genügt — auch während der Saison oft noch Termine frei.", "Am schnellsten erreichen Sie mich telefonisch oder per WhatsApp — auch kurzfristig während der Saison."]
  - frage: "Wie läuft eine Anfrage ab?"
    antwort: ["Sagen Sie mir kurz, wann Sie kommen und was Sie sich wünschen — ich melde mich persönlich mit einem Terminvorschlag.", "Mit E-Mail-Adresse erhalten Sie eine Bestätigung."]
  - frage: "Was bringt eine Privatstunde gegenüber einem Gruppenkurs?"
    antwort: ["Volle Aufmerksamkeit — eine Stunde bei mir ersetzt Tage im Gruppenkurs", "Die Pisten von Flachau kenne ich wie meine Westentasche: beste Hänge, keine Wartezeiten"]

# Baustein 7: Bewertungen und Stimmen. NUR echte, freigegebene Stimmen (mit Einverständnis der Person).
# Solange die Liste leer ist, wird das Werkzeug list_stimmen NICHT angemeldet.
stimmen: []               # TODO Ulf: echte Gästestimmen, je { text, name_oder_initialen, datum, quelle_url }

# Baustein 1 und 8: Kundenfragen aus echten Gesprächen. Leer, bis Ulf echte (anonymisierte) Fragen liefert.
kundenfragen: []          # TODO Ulf: häufige echte Fragen von Gästen (WhatsApp/Telefon), anonymisiert, mit Antwort

# Rechtliches: Kurzfassung der Datenschutzerklärung — wörtliche Sätze aus content/de/datenschutz.
datenschutz:
  - "Diese Website setzt keine Cookies, verwendet kein Tracking und keine Analyse-Dienste."
  - "Die Seite wird als statische Website bei GitHub Pages (GitHub Inc.) gehostet."
  - "Die Anfrage wird auf einem Server in der EU (Hetzner Online GmbH, Falkenstein, Deutschland) entgegengenommen"
  - "sie wird nach 30 Tagen automatisch gelöscht"
  - "Der Dienst wird erst geladen, wenn Sie ein Feld des Formulars berühren — nicht schon beim Aufruf der Seite."
  - "Die Anfrage wird nicht mit künstlicher Intelligenz ausgewertet und nicht an Dritte weitergegeben."
  - "Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch, Widerruf einer Einwilligung mit Wirkung für die Zukunft, Beschwerde bei der Datenschutzbehörde (dsb.gv.at)."

# Themen, zu denen die Website (noch) nichts sagt. Agenten bekommen sie als „bitte bei Ulf erfragen“.
# Ein Thema fällt aus der Liste, sobald das Feld oben (Pfad in `feld`) gefüllt ist.
offen_bei_ulf:
  - { thema: "Stornobedingungen", feld: "bedingungen.storno" }
  - { thema: "Regelung bei Schlechtwetter oder Liftstillstand", feld: "bedingungen.schlechtwetter" }
  - { thema: "Zahlungsart und Zahlungszeitpunkt", feld: "bedingungen.zahlung" }
  - { thema: "Ob die Liftkarte im Preis enthalten ist", feld: "bedingungen.liftkarte" }
  - { thema: "Leihausrüstung", feld: "bedingungen.leihausruestung" }
  - { thema: "Mindestalter für Kinder", feld: "bedingungen.kinder_mindestalter" }
  - { thema: "Genaue Saisondaten (erster und letzter Unterrichtstag)", feld: "saison.genaue_daten" }
  - { thema: "Genauer Treffpunkt, Anfahrt und Parken", feld: "treffpunkt.anfahrt" }
