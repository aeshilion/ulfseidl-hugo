baseURL = "https://ersteschischule.at/"
title = "Ulf Seidl — Skilehrer in Flachau"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# Keine Kategorien/Schlagwörter: leere Seiten ohne Layout (Bau-Warnung), nichts davon wird verlinkt.
disableKinds = ["taxonomy", "term"]

# /webmcp.json und /llms.txt — nur für die Startseite der Hauptsprache (content/de/_index.md: outputs),
# gebaut aus data/ulf.yaml + data/webmcp.yaml wie die Werkzeuge (layouts/index.webmcp.json, index.llms.txt).
[outputFormats]
  [outputFormats.webmcp]
    mediaType = "application/json"
    baseName = "webmcp"
    isPlainText = true
    notAlternative = true
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[languages]
  [languages.de]
    weight = 1
    languageName = "Deutsch"
    contentDir = "content/de"
  [languages.en]
    weight = 2
    languageName = "English"
    contentDir = "content/en"
  [languages.nl]
    weight = 3
    languageName = "Nederlands"
    contentDir = "content/nl"

[params]
  phone = "+43 664 5442222"
  whatsapp = "436645442222"
  email = "ulf@ersteschischule.at"
  # Adresse, Angebote, Preise, Saison, Treffpunkt: data/ulf.yaml (eine Quelle für Seite und Agenten)

  # --- Anfrageformular (layouts/partials/anfrage-formular.html, assets/js/anfrage.js) ---------------
  # Das Formular erscheint erst, wenn anfrageEndpoint gesetzt ist (und Turnstile laufen kann).
  # >>> GO-LIVE: hier die Adresse der Ulf-Instanz der contact-api eintragen, z. B.
  #     "https://form.ersteschischule.at/contact" — Hostname = Cloudflare-Tunnel-Route auf 127.0.0.1:8092
  #     (projekt-entwicklung-contact-api, deploy/ulf/, README „Dritte Instanz“). Leer = kein Formular.
  anfrageEndpoint = "https://anfrage.ersteschischule.at/contact"
  # Turnstile-Widget „ersteschischule.at“ (öffentlicher Sitekey, kein Geheimnis; das Secret liegt
  # nur am Server als TURNSTILE_SECRET in /etc/ulf-contact-api.env).
  turnstileSitekey = "0x4AAAAAAFK-jnpQcDpDW-Re"
  # WebMCP-Origin-Trial-Token für https://ersteschischule.at (Chrome 149–156, Trial endet 17.11.2026).
  # Leer = kein Meta-Tag; ohne Token sehen nur Browser mit eingeschaltetem WebMCP die Werkzeuge
  # (für Besucher sind sie dann UNSICHTBAR — Taxi Alpin hatte genau das, Messung 27.09.2026).
  # >>> TOKEN HOLEN (Emanuel, Google-Konto wie bei den anderen Kundenseiten):
  #   1. https://developer.chrome.com/origintrials/#/trials/active → Trial „WebMCP“ → „Register“.
  #   2. Web Origin: https://ersteschischule.at  (genau so, ohne www, ohne Pfad; die Seite läuft ohne www).
  #      „Match all subdomains“ und „third-party matching“ NICHT ankreuzen — ein Third-Party-Token im
  #      statischen Meta-Tag schlägt still fehl.
  #   3. Den Token (lange base64-Zeichenkette) hier zwischen die Anführungszeichen setzen — roh, nicht
  #      in zusätzliche Anführungszeichen oder JSON verpackt (projekt-entwicklung.at, 22.09.2026: doppelt
  #      kodierter Token wurde still verworfen). layouts/index.html schreibt ihn als
  #      <meta http-equiv="origin-trial" content="…"> in den Kopf jeder Startseite.
  #   4. Prüfen nach dem Live-Gang in Google Chrome ≥ 149: DevTools → Application → Frames → Origin Trials
  #      zeigt „WebMCP“ als Valid; `typeof document.modelContext` = "object".
  #   Der Token ist öffentlich (steht im HTML), kein Geheimnis. Ablauf 17.11.2026 im Kalender halten.
  webmcpOriginTrial = ""
